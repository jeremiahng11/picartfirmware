# Every push to main cuts the next patch release: 1.0.1 -> 1.0.2 -> ... -> 1.0.9
# -> 1.1.0. Ten patches per minor, and each minor carries its own code name
# (see BUILD_NAMES in CMakeLists.txt), so a series rolls over to the next name
# once it runs out of patch numbers.
#
# This job tags, builds and releases in one place on purpose: a tag pushed with
# GITHUB_TOKEN does not trigger other workflows, so release.yml would never fire
# for a tag created here. release.yml still handles tags pushed by hand.
name: Auto release on push

on:
  push:
    branches: [ "main" ]
    # Only firmware sources cut a release. There are ten patch numbers per
    # code name, so a README or workflow edit should not consume one.
    paths:
      - '**.c'
      - '**.h'
      - '**.h.in'
      - '**.pio'
      - '**.asm'
      - '**.inc'
      - '**.ld'
      - '**/CMakeLists.txt'
      - 'cmakeHelpers/**'
  # Lets a release be cut by hand, for when something outside the filtered
  # paths needs to ship.
  workflow_dispatch:

env:
  BUILD_TYPE: Release

permissions:
  contents: write

jobs:
  autorelease:
    runs-on: ubuntu-latest
    container:
      image: shilga/raspberry-pi-pico-gbdk-docker:v0.4

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0 # need the full tag history to work out the next version

    - name: Work out the next version
      id: version
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "1.0.0")
        MAJ=${LATEST%%.*}; REST=${LATEST#*.}; MIN=${REST%%.*}; PAT=${REST#*.}
        PAT=$((PAT + 1))
        if [ "$PAT" -gt 9 ]; then MIN=$((MIN + 1)); PAT=0; fi
        # The minor rolls at 9 too, so the series always has a code name:
        # 1.9.9 -> 2.0.0, never 1.10.0 (BUILD_NAMES defines x.0 through x.9).
        if [ "$MIN" -gt 9 ]; then MAJ=$((MAJ + 1)); MIN=0; fi
        NEXT="$MAJ.$MIN.$PAT"
        echo "Latest tag $LATEST -> next $NEXT"
        echo "next=$NEXT" >> $GITHUB_OUTPUT

    - name: Configure CMake
      run: |
        cmake --fresh -B "$GITHUB_WORKSPACE/build" \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DBUILD_TIME_PROVIDED_VERSION=${{ steps.version.outputs.next }}

    - name: Build
      run: cmake --build "$GITHUB_WORKSPACE/build" --config ${{ env.BUILD_TYPE }}

    - name: Tag the release
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "${{ steps.version.outputs.next }}" \
          -m "${{ steps.version.outputs.next }}"
        git push origin "${{ steps.version.outputs.next }}"

    - name: Package artifacts
      run: |
        cd "$GITHUB_WORKSPACE/build"
        tar czf "rp2040-gb-cartridge-${{ steps.version.outputs.next }}.tgz" *.bin *.elf *.elf.map *.hex *.uf2
        cp rp2040-gb-cartridge.uf2 "picart-${{ steps.version.outputs.next }}.uf2"
        echo "--- release candidates ---"
        ls -l "rp2040-gb-cartridge-${{ steps.version.outputs.next }}.tgz" "picart-${{ steps.version.outputs.next }}.uf2"

    - name: Release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        prerelease: false
        draft: false
        tag_name: ${{ steps.version.outputs.next }}
        name: ${{ steps.version.outputs.next }}
        files: |
          build/rp2040-gb-cartridge-${{ steps.version.outputs.next }}.tgz
          build/picart-${{ steps.version.outputs.next }}.uf2
